<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SafeWalk SJ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
    #panel { width: 360px; padding: 16px; box-sizing: border-box; overflow-y: auto; border-right: 1px solid #ddd; }
    #map { flex: 1; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    textarea { width: 100%; height: 280px; box-sizing: border-box; font: inherit; font-size: 13px; }
    button { padding: 8px 12px; margin: 6px 6px 0 0; cursor: pointer; }
    #status { margin-top: 10px; font-size: 14px; }
    .error { color: #b00020; }
    .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .legend div { font-size: 13px; margin: 3px 0; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>SafeWalk SJ</h1>
    <p>Paste a news article, then click <b>Extract incidents</b>.</p>
    <textarea id="article" placeholder="Paste article text here..."></textarea>
    <button id="submit">Extract incidents</button>
    <button id="samples">Load samples</button>
    <button id="clear">Clear map</button>
    <div id="status"></div>
    <h3>Legend</h3>
    <div class="legend" id="legend"></div>
  </div>
  <div id="map"></div>

  <script>
    const COLORS = { harassment: "#f39c12", assault: "#e74c3c", theft: "#3498db", stalking: "#8e44ad", other: "#7f8c8d" };

    const map = L.map("map").setView([37.3352, -121.8811], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
    const pins = L.layerGroup().addTo(map);

    document.getElementById("legend").innerHTML = Object.entries(COLORS)
      .map(([cat, color]) => `<div><span style="background:${color}"></span>${cat}</div>`).join("");

    // Escape text so article content can't inject HTML into popups
    function esc(s) {
      const d = document.createElement("div");
      d.textContent = String(s ?? "");
      return d.innerHTML;
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = isError ? "error" : "";
    }

    function addPin(inc) {
      const color = COLORS[inc.category] || COLORS.other;
      L.circleMarker([inc.lat, inc.lng], {
        radius: 9, color: "#fff", weight: 2, fillColor: color, fillOpacity: 0.9
      }).bindPopup(
        `<b>${esc(inc.category)}</b><br>${esc(inc.summary)}<br><br>` +
        `<b>Where:</b> ${esc(inc.location_text)}<br>` +
        `<b>When:</b> ${esc(inc.date)}, ${esc(inc.time_of_day)}`
      ).addTo(pins);
    }

    document.getElementById("submit").onclick = async () => {
      const text = document.getElementById("article").value.trim();
      if (!text) return setStatus("Please paste an article first.", true);
      const btn = document.getElementById("submit");
      btn.disabled = true;
      setStatus("Asking Claude... (this can take a little while)");
      try {
        const res = await fetch("/api/extract", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        if (!res.ok) return setStatus(data.error || "Something went wrong.", true);
        data.incidents.forEach(addPin);
        setStatus(`Found ${data.incidents.length} incident(s).`);
      } catch (e) {
        setStatus("Could not reach the server. Is app.py running?", true);
      } finally {
        btn.disabled = false;
      }
    };

    // Puts all sample articles into the text box; then click "Extract incidents"
    document.getElementById("samples").onclick = async () => {
      const res = await fetch("/api/samples");
      const samples = await res.json();
      document.getElementById("article").value = samples
        .map(s => `--- ${s.headline} ---\n${s.body}`).join("\n\n");
      setStatus(`Loaded ${samples.length} sample articles. Click "Extract incidents".`);
    };

    document.getElementById("clear").onclick = () => { pins.clearLayers(); setStatus(""); };
  </script>
</body>
</html>
